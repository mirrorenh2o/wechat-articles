name: Check Biweekly Progress

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Time window in days (default: 2)'
        required: false
        default: '2'

jobs:
  check-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch recent PRs and commits
        id: fetch_activity
        run: |
          DAYS="${{ github.event.inputs.days }}"
          SINCE_DATE=$(date -d "${DAYS} days ago" --iso-8601=seconds)
          echo "Checking activity since: $SINCE_DATE"
          
          # Fetch PRs created or updated in the last ${DAYS} days
          echo "=== Recent PRs ===" > activity_report.txt
          gh pr list --state all --search "created:>$SINCE_DATE" \
            --json title,state,author,url,createdAt \
            --jq '.[] | "\(.createdAt[:10]) | \(.state) | \(.title) | @\(.author.login) | \(.url)"' >> activity_report.txt
          
          # Count PRs
          PR_COUNT=$(gh pr list --state all --search "created:>$SINCE_DATE" | wc -l)
          
          # Fetch recent commits directly to main branch
          echo "" >> activity_report.txt
          echo "=== Recent Commits to main ===" >> activity_report.txt
          gh api repos/ruyisdk/wechat-articles/commits?since=$SINCE_DATE \
            --jq '.[] | "\(.commit.author.date[:10]) | \(.sha[:7]) | \(.commit.message | split("\n")[0]) | @\(.author.login)"' >> activity_report.txt
          
          # Count commits
          COMMIT_COUNT=$(gh api repos/ruyisdk/wechat-articles/commits?since=$SINCE_DATE | jq '. | length')
          
          echo "pr_count=$PR_COUNT" >> $GITHUB_OUTPUT
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat activity_report.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send progress report to Feishu
        run: |
          REPORT="${{ steps.fetch_activity.outputs.report }}"
          PR_COUNT="${{ steps.fetch_activity.outputs.pr_count }}"
          COMMIT_COUNT="${{ steps.fetch_activity.outputs.commit_count }}"
          DAYS="${{ github.event.inputs.days }}"
          
          # Debug: print raw REPORT
          echo "=== RAW REPORT ==="
          echo "$REPORT"
          echo "=== END REPORT ==="
          
          # Split REPORT into lines for proper formatting
          if [ "$PR_COUNT" -eq 0 ] && [ "$COMMIT_COUNT" -eq 0 ]; then
            DETAILS_LINES='["❌ No recent activity detected."]'
          else
            # Build a JSON array from REPORT lines
            DETAILS_LINES=$(echo "$REPORT" | jq -R -s 'split("\n") | map(select(length > 0))')
          fi
          
          # Debug: print DETAILS_LINES
          echo "=== DETAILS_LINES ==="
          echo "$DETAILS_LINES"
          echo "=== END DETAILS_LINES ==="
          
          # Build the full content array with jq
          JSON_PAYLOAD=$(jq -n \
            --arg pr_count "$PR_COUNT" \
            --arg commit_count "$COMMIT_COUNT" \
            --arg days "$DAYS" \
            --argjson details_lines "$DETAILS_LINES" \
            '{
              msg_type: "post",
              content: {
                post: {
                  zh_cn: {
                    title: "📊 RuyiSDK Biweekly Progress Report",
                    content: [
                      [
                        {tag: "text", text: "📈 Activity in the last \($days) days:"}
                      ],
                      [
                        {tag: "text", text: "• Pull Requests: \($pr_count)"}
                      ],
                      [
                        {tag: "text", text: "• Commits to main: \($commit_count)"}
                      ],
                      [
                        {tag: "text", text: ""}
                      ],
                      [
                        {tag: "text", text: "📋 Recent activity details:"}
                      ],
                      ($details_lines | map([{tag: "text", text: .}]))
                    ]
                  }
                }
              }
            }')
          
          # Debug: print JSON_PAYLOAD
          echo "=== JSON_PAYLOAD ==="
          echo "$JSON_PAYLOAD"
          echo "=== END JSON_PAYLOAD ==="
          
          # Send to Feishu with verbose output
          curl -v -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            --data-binary "$JSON_PAYLOAD"
